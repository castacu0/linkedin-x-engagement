name: Daily engagement scan

on:
  schedule:
    # 14:00 UTC = 08:00 America/Mexico_City (UTC-6). Runs Mon/Wed/Fri to match a
    # ~3-posts-per-week engagement cadence. cron is always in UTC — change the
    # time or days if your timezone/cadence changes. (0=Sun … 1=Mon,3=Wed,5=Fri)
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch: # lets you run it on demand from the Actions tab

permissions:
  contents: write # to commit generated drafts back to the branch

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run scan
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          # Mon/Wed/Fri schedule means up to a 72h gap (Fri→Mon); look back far
          # enough to never miss a post. Cross-run duplicates are filtered by the
          # seen-id store, so the overlap is harmless.
          SCAN_SINCE_HOURS: '72'
        run: npm run scan

      - name: Commit drafts
        run: |
          git config user.name "engagement-bot"
          git config user.email "actions@github.com"
          git add public/data drafts
          if git diff --staged --quiet; then
            echo "No new drafts to commit."
          else
            git commit -m "chore: daily engagement drafts $(date -u +%Y-%m-%d)"
            git push
          fi
